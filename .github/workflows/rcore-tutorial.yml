name: rCore-Tutorial

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-rcore-tutorial-boot.sh"
      - ".github/workflows/rcore-tutorial.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/macros/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  push:
    branches: ["main", "ci/rcore-tutorial-boot"]  # 添加你的测试分支
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-rcore-tutorial-boot.sh"
      - ".github/workflows/rcore-tutorial.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/macros/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  rcore-tutorial-boot:
    name: Boot rCore-Tutorial (${{ matrix.boot-path }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        boot-path:
          - sbi
          - u-boot
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            flex \
            gcc-riscv64-linux-gnu \
            libc6-dev-riscv64-cross \
            libssl-dev \
            qemu-system-misc
          qemu-system-riscv64 --version

      - name: Install required cargo
        run: cargo install --locked cargo-binutils@0.4.0

      # The payload is a pinned revision, so the key changes only when the pin
      # does; bump the trailing revision after editing its build recipe.
      - name: Cache rCore-Tutorial build
        uses: actions/cache@v5
        with:
          path: .cache/rcore-tutorial
          key: rcore-tutorial-c91bd3752b53-v1

      # Only the u-boot path builds U-Boot. Keep it in a separate cache so
      # another matrix entry cannot populate the shared key without the binary.
      - name: Cache U-Boot build
        if: matrix.boot-path == 'u-boot'
        uses: actions/cache@v5
        with:
          path: .cache/uboot-smode
          key: uboot-smode-25049ad56082-v1

      - name: Build RustSBI Prototyper
        run: |
          cargo prototyper build
          cargo prototyper build jump

      - name: Boot rCore-Tutorial
        run: .github/scripts/prototyper-rcore-tutorial-boot.sh "${{ matrix.boot-path }}"

      - name: Upload rCore-Tutorial log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rcore-tutorial-log-${{ matrix.boot-path }}
          path: qemu-logs/prototyper-rcore-tutorial-${{ matrix.boot-path }}.log
